name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build production image
        run: docker build -t yildiz-otagi-astro-api:${{ github.sha }} .

      - name: Smoke-test production image
        run: |
          container_id="$(
            docker run --detach --rm \
              --publish 8080:8080 \
              --env ASTRO_API_KEY=ci-test-key \
              --env SOURCE_COMMIT=${{ github.sha }} \
              yildiz-otagi-astro-api:${{ github.sha }}
          )"
          trap 'docker stop "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/source \
              | grep --quiet "${{ github.sha }}"; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1
