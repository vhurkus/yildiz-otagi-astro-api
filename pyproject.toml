[project]
name = "yildiz-otagi-astro-api"
version = "1.0.0"
description = "AGPL source for the Yildiz Otagi astrology calculation service"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
    "fastapi==0.140.0",
    "uvicorn[standard]==0.51.0",
    "kerykeion==5.12.9",
    "pyswisseph==2.10.3.2",
    "timezonefinder==8.2.5",
    "pytz==2026.2",
    "pydantic==2.13.4",
]

[dependency-groups]
dev = ["ruff==0.16.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001"]
